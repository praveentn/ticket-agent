# Configuration-driven agent registration (spec §6 Maintainability).
# Adding a department = add an entry here + its knowledge documents. No graph code changes.
agents:
  it:
    label: IT Service Desk Agent
    description: Devices, accounts, passwords, network/VPN, email, software and access.
    knowledge_collections: [it]
    tools: [reset_password, unlock_account, request_software, grant_admin_access, create_ticket, get_ticket_status]
    support_queue: IT Service Desk L2
    prompt_version: it.v1
    keywords:
      password: 3
      vpn: 3
      laptop: 3
      wifi: 3
      wi-fi: 3
      network: 2
      outlook: 3
      email: 2
      mfa: 3
